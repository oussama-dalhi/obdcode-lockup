<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style.css">
  <script src="./src/script.js" defer></script>
  <title>OBD-App</title>
</head>
<body>
  <main class="app">
  <header class="header">
    <div class="logo">
      <span>OSDAuto</span>
    </div>
  </header>

  <section class="hero">
    <h1>OBD-II Fault Code Lock-up</h1>
  </section>

  <section class="search-card">
    <form id="fault-form">
      <label for="dtc" class="label">
        Enter Fault Code
      </label>

      <div class="input-wrapper">
        <input
          type="text"
          id="dtc"
          name="dtc"
          placeholder="P0300"
          pattern="[A-Za-z][0-9]{4}"
          maxlength="5"
          autocomplete="off"
          required
        />

        <button
          type="submit"
          class="search-btn"
          id="search-button"
        >
          Search Fault Code
        </button>
      </div>
    </form>

    <div class="stats">

    </div>
  </section>

  <section
    class="results-card"
    aria-live="polite"
  >
  </section>

</main>
</body>
</html>
